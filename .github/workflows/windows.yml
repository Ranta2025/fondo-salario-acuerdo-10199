name: windows

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86  # 32-bit build runs on both 32-bit and 64-bit Windows
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Test and lint
        run: |
          pytest -q
          ruff check src tests
      - name: Check tkinter is available
        run: python -c "import struct, tkinter; print('tk', tkinter.TkVersion, struct.calcsize('P')*8, 'bit')"
      - name: Build application folder
        run: pyinstaller --onedir --windowed --name FondoSalario --paths src src/fondo_salario/__main__.py
      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item packaging/LEEME.txt dist/FondoSalario/LEEME.txt
          Compress-Archive -Path dist/FondoSalario -DestinationPath dist/FondoSalario-windows.zip
      - name: Smoke-test the packaged application
        shell: pwsh
        run: |
          $p = Start-Process dist/FondoSalario/FondoSalario.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "the packaged app did not finish its self-test" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Write-Host "self-test OK"
      - uses: actions/upload-artifact@v4
        with:
          name: FondoSalario-windows
          path: dist/FondoSalario-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FondoSalario-windows.zip
