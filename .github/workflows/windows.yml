name: windows

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Test and lint
        run: |
          pytest -q
          ruff check src tests
      - name: Check tkinter is available
        run: python -c "import tkinter; print('tk', tkinter.TkVersion)"
      - name: Build executable
        run: pyinstaller --onefile --windowed --name FondoSalario --paths src src/fondo_salario/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: FondoSalario-windows
          path: dist/FondoSalario.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FondoSalario.exe
